<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khipu</title>
    <meta
      name="description"
      content="Explore 684 Inka khipus — every cord, knot and colour — from the Khipu Field Guide and the Open Khipu Repository."
    />
    <!-- theme bootstrap: apply the stored/system theme before first paint -->
    <script>
      try {
        const stored = window.localStorage.getItem("theme");
        const mode =
          stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved = mode === "auto" ? (prefersDark ? "dark" : "light") : mode;
        const root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add(resolved);
        if (mode === "auto") root.removeAttribute("data-theme");
        else root.setAttribute("data-theme", mode);
        root.style.colorScheme = resolved;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
